<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Nestlé Empire</title>
  <meta name="description" content="An independent, interactive map of the brands Nestlé owns, part-owns, licenses and used to own.">
  <meta property="og:title" content="The Nestlé Empire">
  <meta property="og:description" content="An interactive map of the brands Nestlé owns, partly owns, and used to own.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg stroke='%23C9B49C' stroke-width='3'%3E%3Cline x1='32' y1='32' x2='12' y2='14'/%3E%3Cline x1='32' y1='32' x2='54' y2='20'/%3E%3Cline x1='32' y1='32' x2='22' y2='54'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='13' fill='%235A3A28'/%3E%3Ccircle cx='12' cy='14' r='7' fill='%23D1913C'/%3E%3Ccircle cx='54' cy='20' r='7' fill='%23B4443C'/%3E%3Ccircle cx='22' cy='54' r='7' fill='%236F8F4E'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,500&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="map-wrap">
    <canvas id="map" aria-hidden="true"></canvas>
  </div>

  <header id="topbar"></header>
  <div id="strip" hidden></div>
  <aside id="card" aria-hidden="true"></aside>
  <div id="tooltip"></div>
  <section id="legend" aria-label="Ownership key"></section>

  <nav id="controls" aria-label="Map controls">
    <div class="zoom-pair">
      <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out (−)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg></button>
      <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in (+)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 5v10M5 10h10"/></svg></button>
    </div>
    <button id="show-all" type="button" title="Show everything (0)">Show all</button>
    <button id="tidy" type="button" hidden title="Put everything back where it was">Tidy up</button>
  </nav>

  <div id="caption" class="float-chip"></div>
  <div id="toast" class="float-chip"></div>
  <div id="overshoot" class="float-chip"></div>
  <div id="help-pop" hidden></div>

  <nav id="mirror" class="sr-only" aria-label="Map"></nav>
  <div id="live" class="sr-only" aria-live="polite"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
